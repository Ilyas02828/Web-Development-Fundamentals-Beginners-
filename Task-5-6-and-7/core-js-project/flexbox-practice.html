<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="header-left">
            <h2 class="logo">Logo</h2>

            <button id="menu-btn" class="menu-btn">☰</button>

            <nav class="nav-bar">
                <a href="#">HTML</a>
                <a href="#">CSS</a>
                <a href="#">JavaScript</a>
                <a href="#">SQL</a>
                <a href="#">Java</a>
                <a href="#">Python</a>
                <a href="#">C++</a>
            </nav>
        </div>
        <button id="theme-btn" class="theme-btn">Dark</button>
    </header>

    <section class="pricing">
        <div class="card">
            <h2>Free</h2>
            <h3>$0/mo</h3>
            <p>500 MB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Basic</h2>
            <h3>$10/mo</h3>
            <p>1 GB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Pro</h2>
            <h3>$20/mo</h3>
            <p>10 GB Storage</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Enterprise</h2>
            <h3>$50/mo</h3>
            <p>Unlimited Storage</p>
            <p>24/7 Support</p>
            <button>Choose Plan</button>
        </div>
    </section>

    <section class="contact">
        <h2>Contact Us</h2>

        <form id="contact-form" class="contact-form">
            <input type="text" id="name" class="name" placeholder="Enter Name">
            <p class="error"></p>

            <input type="email" id="email" class="email" placeholder="Enter Email">
            <p class="error"></p>

            <button type="submit"> Submit </button>
        </form>
    </section>

    <script src="./script.js"></script>
</body>

</html>
