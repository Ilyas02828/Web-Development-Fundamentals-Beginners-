<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr 60px;

            grid-template-areas: "header header" "side-bar main" "footer footer";
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background: black;
            color: white;
            font-size: 24px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-bar {
            grid-area: side-bar;
            background: #0f447a;
            color: white;
            padding: 20px;
        }

        .side-bar ul {
            list-style: none;
            margin-top: 20px;
        }

        .side-bar li {
            margin: 15px 0;
        }

        .main {
            grid-area: main;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background: #3e3e3e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;

            margin-top: 20px;
        }

        .photo {
            background: white;
            height: 180px;
            border-radius: 10px;
            font-size: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 0 10px rgba(0, 0, 0, .15);
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="header"> Header </header>

        <aside class="side-bar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Gallery</li>
                <li>Profile</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="main">
            <h2>Photo Gallery</h2>
            <div class="gallery">
                <div class="photo">Photo 1</div>
                <div class="photo">Photo 2</div>
                <div class="photo">Photo 3</div>
                <div class="photo">Photo 4</div>
                <div class="photo">Photo 5</div>
                <div class="photo">Photo 6</div>
                <div class="photo">Photo 7</div>
                <div class="photo">Photo 8</div>
                <div class="photo">Photo 9</div>
                <div class="photo">Photo 10</div>
            </div>
        </main>

        <footer class="footer"> Footer </footer>
    </div>
</body>

</html>
