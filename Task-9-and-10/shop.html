<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> E-Commerce Product Shop</title>

    <link rel="stylesheet" href="../bootstrap-css/bootstrap.min.css">
    <link rel="stylesheet" href="./custom-style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"> E-Commerce Shop </a>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="header-link nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="header-link nav-link" href="#products">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="header-link nav-link" href="#questions">Questions</a>
                    </li>

                    <li class="nav-item">
                        <button class="header-button btn btn-light ms-lg-3" data-bs-toggle="offcanvas"
                            data-bs-target="#cart"> Cart (<span id="cartCount">0</span>)</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1400/500?1" class="d-block w-100">
                <div class="carousel-caption">
                    <h1>Summer Sale</h1>
                    <p>Up to 50% Off</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1400/500?2" class="d-block w-100">
                <div class="carousel-caption">
                    <h1>Latest Collection</h1>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1400/500?3" class="d-block w-100">
                <div class="carousel-caption">
                    <h1>New Arrivals</h1>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <section class="container py-5" id="products">
        <h2 class="text-center mb-5"> Featured Products </h2>
        <div class="row g-4" id="products-container">
        </div>
    </section>

    <div class="offcanvas offcanvas-end" id="cart">
        <div class="offcanvas-header">
            <h5>Shopping Cart</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"> </button>
        </div>

        <div class="offcanvas-body">
            <ul id="cartList" class="list-group mb-3"> </ul>
            <hr>
            <h5>Total: <span id="cartTotal">$0</span></h5>
        </div>
    </div>

    <section class="container py-5" id="questions">
        <h2 class="text-center mb-4"> Frequently Asked Questions </h2>

        <div class="accordion" id="faqAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button"> Shipping Time </button>
                </h2>

                <div id="one" class="accordion-collapse collapse show">
                    <div class="accordion-body"> 3-5 Business Days. </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed"> Refund Policy </button>
                </h2>

                <div id="two" class="accordion-collapse collapse">
                    <div class="accordion-body"> 30-day return policy. </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../bootstrap-js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
